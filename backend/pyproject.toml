[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Group Activity Planner"
readme = "README.md"
authors = [
    { name = "Max Field", email = "mfield.dev@gmail.com" },
    { name = "Oli Kay"},
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.146.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
